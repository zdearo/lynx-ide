name: Browser engine

# Builds the package Lynx downloads for its browser, one per platform: the host program and the CEF
# runtime, with a manifest holding its version, protocol and SHA-256. The engine has its own version,
# so it is not tied to the app's releases: run it by hand. Without `publish` it only builds and checks
# the package, as an artifact. With `publish`, the package goes to engine/ in the release bucket, where
# the app looks for it.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the engine to the update server
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  engine:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      PUBLISH: ${{ github.event.inputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # CEF's wrapper library is built from source with cmake and ninja.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang bzip2 binutils \
            libgtk-3-dev libx11-dev libxcomposite-dev libxdamage-dev libxrandr-dev libnss3-dev

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - uses: oven-sh/setup-bun@v2

      # rust-toolchain.toml pins the stable channel.
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The CEF download is the slow part and is the same from one run to the next.
      - uses: actions/cache@v4
        with:
          path: ~/.lynx/engine
          key: cef-${{ matrix.name }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: bun install --frozen-lockfile

      - name: Build the package
        run: bun run browser:engine -- --bundle --out engine-package

      - uses: actions/upload-artifact@v4
        with:
          name: browser-engine-${{ matrix.name }}
          path: engine-package/*

      # Always runs: a package that the app would refuse must not get as far as the bucket.
      - name: Check the package
        run: bun scripts/engine-publish.mjs --package engine-package --out engine-out

      - name: Install the upload tool
        if: env.PUBLISH == 'true'
        working-directory: services/update-worker
        run: bun install --frozen-lockfile

      - name: Publish to the update server
        if: env.PUBLISH == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/engine-publish.mjs --package engine-package --out engine-out --upload
