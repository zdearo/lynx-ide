[package]
name = "lynx-pty-daemon"
version = "0.1.0"
description = "The process that owns the terminals' PTYs, so sessions outlive the app's window"
edition = "2024"

[dependencies]
lynx-browser-protocol = { path = "../browser-protocol" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal"] }

[dev-dependencies]
tempfile = "3.27.0"
