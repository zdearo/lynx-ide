name: Build

# Two jobs per platform, side by side. `verify` checks the frontend and the backend and runs the Rust
# tests: the terminal code has Windows-only paths that nothing else here compiles. `package` builds the
# installers. Run it by hand, or push a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2

      # rust-toolchain.toml pins the stable channel with rustfmt and clippy.
      - uses: dtolnay/rust-toolchain@stable

      # Saved even when the run fails, so the next run starts warm.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: verify
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      - name: Check the frontend
        run: bun run check

      - name: Check the backend
        run: bun run rust:check

      # A step's result on Windows is its last command's, so a failed check could hide behind
      # a passing test run. The test step still runs after a failed check, to show both.
      - name: Test the backend
        if: always()
        run: bun run rust:test

  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2

      # rust-toolchain.toml pins the stable channel with rustfmt and clippy.
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: package
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      # The Tauri bundler downloads WiX and NSIS into the user's cache, and skips the download when
      # they are already there. Keeping them between runs saves the download on every run.
      - name: Cache the installer tools (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/tauri/WixTools314
            ~/AppData/Local/tauri/NSIS
          key: installer-tools-v1

      - name: Build the installers
        env:
          # Tags are the releases and keep the full optimization. Other runs only need to show the
          # installers build, so they skip LTO, which is most of the link time.
          CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/v') && 'fat' || 'off' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '16' }}
        run: bun run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: lynx-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
