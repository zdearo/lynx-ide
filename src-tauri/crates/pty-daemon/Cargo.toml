[package]
name = "lynx-pty-daemon"
version = "0.1.0"
description = "The process that owns the terminals' PTYs, so sessions outlive the app's window"
edition = "2024"

[dependencies]
lynx-browser-protocol = { path = "../browser-protocol" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
