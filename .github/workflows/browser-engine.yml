name: Browser engine

# Builds the package Lynx downloads for its browser (the host program and the stripped CEF runtime,
# with a manifest holding its version, protocol and SHA-256), and attaches both files to the release
# when a v* tag is pushed. The app reads the manifest from the latest release first. Run it by hand
# to get the files as an artifact without publishing anything.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # CEF's wrapper library is built from source with cmake and ninja.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang bzip2 binutils \
            libgtk-3-dev libx11-dev libxcomposite-dev libxdamage-dev libxrandr-dev libnss3-dev

      - uses: oven-sh/setup-bun@v2

      # rust-toolchain.toml pins the stable channel.
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The CEF download is the slow part and is the same from one run to the next.
      - uses: actions/cache@v4
        with:
          path: ~/.lynx/engine
          key: cef-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build the package
        run: bun run browser:engine -- --bundle --out engine-package

      - uses: actions/upload-artifact@v4
        with:
          name: browser-engine-linux-x64
          path: engine-package/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" engine-package/* --clobber
