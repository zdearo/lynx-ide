name: Browser engine

# Builds the package Lynx downloads for its browser, one per platform (the host program and the CEF
# runtime, with a manifest holding its version, protocol and SHA-256), and attaches both files to the
# release when a v* tag is pushed. The app reads the manifest from the latest release first. Run it by hand
# to get the files as an artifact without publishing anything.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  engine:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # CEF's wrapper library is built from source with cmake and ninja.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang bzip2 binutils \
            libgtk-3-dev libx11-dev libxcomposite-dev libxdamage-dev libxrandr-dev libnss3-dev

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - uses: oven-sh/setup-bun@v2

      # rust-toolchain.toml pins the stable channel.
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The CEF download is the slow part and is the same from one run to the next.
      - uses: actions/cache@v4
        with:
          path: ~/.lynx/engine
          key: cef-${{ matrix.name }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: bun install --frozen-lockfile

      - name: Build the package
        run: bun run browser:engine -- --bundle --out engine-package

      - uses: actions/upload-artifact@v4
        with:
          name: browser-engine-${{ matrix.name }}
          path: engine-package/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" engine-package/* --clobber
