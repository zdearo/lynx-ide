name: Build

# Two jobs per platform, side by side. `verify` checks the frontend and the backend and runs the Rust
# tests: the terminal code has Windows-only paths that nothing else here compiles. `package` builds the
# installers, signed for the updater. `publish` releases the update when the version in the config is
# newer than the stable channel, on every push to main: a release is a version bump merged to main. A push
# that changes the browser engine rebuilds and publishes it first (`engine`), and `publish` refuses a
# release whose engine does not speak the app's protocol. A v* tag and a manual run with `publish` ask too.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Release the update if its version is newer than the stable channel
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2

      # rust-toolchain.toml pins the stable channel with rustfmt and clippy.
      - uses: dtolnay/rust-toolchain@stable

      # Saved even when the run fails, so the next run starts warm.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: verify
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      - name: Check the frontend
        run: bun run check

      - name: Check the backend
        run: bun run rust:check

      # A step's result on Windows is its last command's, so a failed check could hide behind
      # a passing test run. The test step still runs after a failed check, to show both.
      - name: Test the backend
        if: always()
        run: bun run rust:test

  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2

      # rust-toolchain.toml pins the stable channel with rustfmt and clippy.
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: package
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      # The Tauri bundler downloads WiX and NSIS into the user's cache, and skips the download when
      # they are already there. Keeping them between runs saves the download on every run.
      - name: Cache the installer tools (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/tauri/WixTools314
            ~/AppData/Local/tauri/NSIS
          key: installer-tools-v1

      - name: Build the installers
        env:
          # Tags are the releases and keep the full optimization. Other runs only need to show the
          # installers build, so they skip LTO, which is most of the link time.
          CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/v') && 'fat' || 'off' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '16' }}
          # Signs the updater files (.sig). Without the key the bundle step stops.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: lynx-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Finds out whether this push changed what the browser engine is made of. Only a push to main can:
  # tags and manual runs release the app and leave the engine as it is.
  changes:
    name: Find what changed
    runs-on: ubuntu-22.04
    outputs:
      engine: ${{ steps.paths.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the engine's inputs
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          engine=false
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              engine=true
            elif git diff --name-only "$BEFORE" "$SHA" -- \
                src-tauri/crates/browser-host src-tauri/crates/browser-protocol \
                scripts/browser-engine.mjs scripts/engine-publish.mjs \
                src-tauri/Cargo.lock .github/workflows/browser-engine.yml | grep -q .; then
              engine=true
            fi
          fi
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "the browser engine is rebuilt: $engine"

  # Builds and publishes the browser engine before the app, when its inputs changed. So the app
  # released after it finds an engine that speaks its protocol.
  engine:
    name: Browser engine
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    uses: ./.github/workflows/browser-engine.yml
    with:
      publish: true
    secrets: inherit

  publish:
    name: Publish the update
    needs: [package, engine]
    # Also runs when the engine was not needed, but never after a failed package or engine build.
    if: always() && needs.package.result == 'success' && (needs.engine.result == 'success' || needs.engine.result == 'skipped')
    runs-on: ubuntu-22.04
    # One publish at a time, so two runs cannot promote over each other.
    concurrency:
      group: publish-stable
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # A tag, a push to main and a manual run with `publish` all ask for a release.
      REQUESTED: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event.inputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v4
        with:
          pattern: lynx-*
          merge-multiple: true
          path: dist

      # Artifacts keep their folders (appimage/, nsis/), so move the installers up to dist/ itself.
      - name: Flatten the installers
        run: |
          find dist -mindepth 2 -type f -exec mv {} dist/ \;

      # The manifest may only move forward, so read what the stable channel serves now.
      # A 404 means no release has been published yet.
      - name: Read the current stable version
        run: |
          status=$(curl -s -o current.json -w '%{http_code}' https://downloads.zdearo.dev/channels/stable.json)
          case "$status" in
            200) ;;
            404) rm -f current.json ;;
            *) echo "could not read the stable channel: HTTP $status"; exit 1 ;;
          esac

      # A version already on the stable channel is not released again. So a merge to main that does
      # not bump the version publishes nothing, and a manual run only checks the package.
      - name: Decide what this run does
        id: decide
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          current=""
          if [ -f current.json ]; then current=$(jq -r .version current.json); fi
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }
          if [ "$REQUESTED" != "true" ]; then
            mode=check
          elif [ -n "$current" ] && ! newer "$version" "$current"; then
            mode=skip
            echo "version $version is already on the stable channel ($current): nothing to release"
          else
            mode=publish
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "this run will $mode"

      - name: Build and check the manifest
        if: steps.decide.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.decide.outputs.mode }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          args=(--dist dist --tag "$tag" --out out)
          # Only a release must be newer than the channel; a check run just shows the manifest builds.
          if [ "$MODE" = publish ] && [ -f current.json ]; then args+=(--current current.json); fi
          bun scripts/release-manifest.mjs "${args[@]}"

      # The app speaks one protocol, and so does the engine it runs. A release whose engine is another
      # protocol would leave every user with an app that cannot open the browser, so it is refused.
      - name: Check that the engine speaks this app's protocol
        if: steps.decide.outputs.mode == 'publish'
        run: |
          app=$(grep -oE 'PROTOCOL_VERSION: u32 = [0-9]+' src-tauri/crates/browser-protocol/src/message.rs | grep -oE '[0-9]+$')
          for platform in linux-x64 windows-x64; do
            engine=$(curl -fsS "https://downloads.zdearo.dev/engine/browser-engine-manifest-$platform.json" | jq -r .protocol)
            if [ "$engine" != "$app" ]; then
              echo "the $platform engine speaks protocol $engine, but this app speaks $app: publish the engine first"
              exit 1
            fi
          done
          echo "the engines speak protocol $app, like this app"

      - name: Install the upload tool
        if: steps.decide.outputs.mode == 'publish'
        working-directory: services/update-worker
        run: bun install --frozen-lockfile

      # Installers first, then the archived manifest, and the stable pointer last: nobody should read
      # a pointer to files that are not there yet.
      - name: Upload the installers and the manifest
        if: steps.decide.outputs.mode == 'publish'
        working-directory: services/update-worker
        run: |
          version=$(jq -r .version ../../out/manifest.json)
          for url in $(jq -r '.platforms[].url' ../../out/manifest.json); do
            name=$(basename "$url")
            ./node_modules/.bin/wrangler r2 object put "lynx-releases-prod/v$version/$name" \
              --file "../../dist/$name" --remote
          done
          ./node_modules/.bin/wrangler r2 object put "lynx-releases-prod/v$version/manifest.json" \
            --file ../../out/manifest.json --content-type application/json --remote
          ./node_modules/.bin/wrangler r2 object put "lynx-releases-prod/channels/stable.json" \
            --file ../../out/manifest.json --content-type application/json --remote

      # The run id in the query keeps the Worker's five-minute cache from answering with an old version.
      - name: Check that the update server offers it
        if: steps.decide.outputs.mode == 'publish'
        run: |
          version=$(jq -r .version out/manifest.json)
          offered=$(curl -fsS "https://updates.zdearo.dev/api/update/linux/x86_64/0.0.0?channel=stable&run=$GITHUB_RUN_ID" | jq -r .version)
          test "$offered" = "$version"
