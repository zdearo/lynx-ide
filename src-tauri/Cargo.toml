[package]
name = "lynx-ide"
version = "0.1.0"
description = "Agentic Development Environment: parallel coding agents in isolated git worktrees"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The browser engine runs in its own process. Its crates are members so they share the lockfile
# and the message contract, but only the app is a default member: a plain `cargo build` never
# needs the CEF runtime (see scripts/browser-engine.mjs).
[workspace]
members = [".", "crates/browser-protocol", "crates/browser-host"]
default-members = ["."]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lynx_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
portable-pty = "0.9.0"
open = "5.4.4"
toml_edit = "0.25.17"
sha2 = "0.10"
tauri-plugin-notification = "2.7.0"
notify = "8.2.0"
ignore = "0.4.33"
lynx-browser-protocol = { version = "0.1.0", path = "crates/browser-protocol" }
url = "2.5.8"
ureq = "3"
flate2 = "1"
tar = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal"] }

[target."cfg(windows)".dependencies]
sysinfo = "0.39.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

